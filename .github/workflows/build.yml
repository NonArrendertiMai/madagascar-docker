name: Check Madagascar Updates

on:
  workflow_dispatch:

  schedule:
    # 每周一 05:00（UTC+8）
    # = 周日 21:00 UTC
    - cron: "0 21 * * 0"

jobs:
  check-madagascar:
    runs-on: ubuntu-latest

    steps:
      - name: Check Madagascar master
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Checking Madagascar upstream"
          echo "========================================"

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          cd "$TMP_DIR"

          echo "Fetching Madagascar master..."

          git init madagascar
          cd madagascar

          git remote add origin https://github.com/ahay/src.git

          git fetch --depth=1 origin master

          COMMIT_SHA=$(git rev-parse FETCH_HEAD)
          COMMIT_DATE=$(git show -s --format=%cs "$COMMIT_SHA")

          VERSION=$(echo "$COMMIT_DATE" | tr -d '-')

          echo
          echo "========================================"
          echo "Madagascar information"
          echo "========================================"
          echo "Commit SHA : $COMMIT_SHA"
          echo "Commit date: $COMMIT_DATE"
          echo "Version    : $VERSION"
          echo "========================================"

          echo "commit=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "commit_date=$COMMIT_DATE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

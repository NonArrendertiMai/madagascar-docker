name: Check Madagascar Updates

on:
  workflow_dispatch:

  schedule:
    # Every Monday at 05:00 Beijing/Singapore time (UTC+8)
    # GitHub Actions cron uses UTC.
    - cron: "0 21 * * 0"

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get latest Madagascar tag
        id: madagascar
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Madagascar upstream tags..."

          git ls-remote --tags --refs https://github.com/ahay/src.git \
            | awk -F/ '{print $3}' \
            | sort -V \
            | tail -n 20

      - name: Show result
        run: |
          echo "Madagascar tag check completed."
